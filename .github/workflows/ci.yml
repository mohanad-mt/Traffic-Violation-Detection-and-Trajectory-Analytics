name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Lint and check formatting
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-video.txt
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test the container
        run: |
          docker build -t traffic-trajectory .
          docker run --rm -i --network=none --read-only traffic-trajectory - \
            < examples/demo.json > "$RUNNER_TEMP/traffic-events.json"
          diff -u examples/demo.expected.json "$RUNNER_TEMP/traffic-events.json"
          python examples/generate_video.py "$RUNNER_TEMP/traffic-demo"
          docker run --rm -i --network=none --read-only \
            --mount "type=bind,src=$RUNNER_TEMP/traffic-demo,dst=/demo,readonly" \
            traffic-trajectory - --video /demo/demo.avi --background /demo/background.png \
            < examples/video.scene.json > "$RUNNER_TEMP/video-events.json"
          python -m traffic_trajectory.evaluate "$RUNNER_TEMP/video-events.json" \
            examples/video.labels.json > "$RUNNER_TEMP/video-metrics.json"
          python -c 'import json, sys; metrics = json.load(open(sys.argv[1]))["overall"]; assert metrics["true_positives"] == 3 and metrics["f1"] == 1, metrics' "$RUNNER_TEMP/video-metrics.json"
